<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>ITVPlayer - IPTV Profissional</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a1929; color:#fff; user-select:none; }
  body { display:flex; flex-direction:column; }

  /* HEADER */
  .header { background:linear-gradient(90deg,#0a1929,#1a2942); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #1e3a5f; box-shadow:0 2px 10px rgba(0,0,0,.5); z-index:10; }
  .logo { font-size:20px; font-weight:bold; color:#00d4ff; letter-spacing:1px; }
  .logo span { color:#fff; }
  .header-btn { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:6px 10px; border-radius:6px; }
  .header-btn:hover { background:rgba(255,255,255,.1); }

  /* SCREENS */
  .screen { display:none; flex:1; overflow-y:auto; padding:16px; animation:fadeIn .3s; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  /* LOGIN */
  #loginScreen { display:none; align-items:center; justify-content:center; background:radial-gradient(circle at top,#1a2942,#0a1929); }
  #loginScreen.active { display:flex; }
  .login-box { background:rgba(20,35,60,.85); padding:32px 28px; border-radius:16px; width:92%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.6); border:1px solid #1e3a5f; }
  .login-box h1 { text-align:center; color:#00d4ff; margin-bottom:6px; font-size:28px; }
  .login-box p.sub { text-align:center; color:#8aa; margin-bottom:24px; font-size:13px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; margin-bottom:6px; color:#8aa; font-size:13px; font-weight:600; }
  .form-group input { width:100%; padding:12px 14px; background:#0a1929; border:1px solid #1e3a5f; border-radius:8px; color:#fff; font-size:15px; outline:none; transition:.2s; }
  .form-group input:focus { border-color:#00d4ff; box-shadow:0 0 0 3px rgba(0,212,255,.15); }
  .btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,#00d4ff,#0077ff); border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; margin-top:8px; transition:.2s; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,212,255,.4); }
  .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
  .error-msg { color:#ff5252; text-align:center; margin-top:12px; font-size:13px; min-height:18px; }

  /* MAIN - 3 JANELAS */
  .main-title { text-align:center; font-size:22px; margin:16px 0 24px; color:#fff; }
  .main-title small { display:block; color:#8aa; font-size:13px; margin-top:4px; }
  .main-grid { display:flex; flex-direction:column; gap:18px; max-width:600px; margin:0 auto; }
  .main-card { background:linear-gradient(135deg,#1a3a6e,#0d2240); border-radius:16px; padding:28px 24px; cursor:pointer; transition:.25s; border:1px solid #1e3a5f; display:flex; align-items:center; gap:20px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .main-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,212,255,.25); border-color:#00d4ff; }
  .main-card:active { transform:scale(.98); }
  .card-icon { font-size:48px; width:70px; height:70px; display:flex; align-items:center; justify-content:center; background:rgba(0,212,255,.15); border-radius:14px; flex-shrink:0; }
  .card-info h3 { font-size:20px; margin-bottom:4px; }
  .card-info p { color:#8aa; font-size:13px; }

  /* CATEGORIES / LIST */
  .list-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .list-item { background:linear-gradient(135deg,#1a3a6e,#0d2240); border-radius:10px; padding:16px 12px; cursor:pointer; text-align:center; transition:.2s; border:1px solid #1e3a5f; min-height:80px; display:flex; align-items:center; justify-content:center; }
  .list-item:hover { background:linear-gradient(135deg,#2a4a8e,#1a3260); border-color:#00d4ff; transform:translateY(-2px); }
  .list-item span { font-size:14px; font-weight:500; word-break:break-word; }

  /* CHANNELS / MOVIES */
  .channel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .channel-card { background:#142340; border-radius:10px; overflow:hidden; cursor:pointer; transition:.2s; border:1px solid #1e3a5f; }
  .channel-card:hover { border-color:#00d4ff; transform:translateY(-2px); }
  .channel-thumb { width:100%; aspect-ratio:16/10; background:#0a1929; display:flex; align-items:center; justify-content:center; font-size:32px; color:#00d4ff; overflow:hidden; }
  .channel-thumb img { width:100%; height:100%; object-fit:cover; }
  .channel-name { padding:10px; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .channel-quality { position:absolute; top:4px; right:4px; background:#00d4ff; color:#000; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:4px; }
  .channel-card { position:relative; }

  /* PLAYER */
  #playerScreen { padding:0; overflow:hidden; background:#000; display:none; flex-direction:column; }
  #playerScreen.active { display:flex; }
  .player-wrap { flex:1; position:relative; background:#000; display:flex; align-items:center; justify-content:center; }
  #videoPlayer { width:100%; height:100%; background:#000; }
  .player-controls { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.9)); padding:16px; display:flex; flex-direction:column; gap:8px; opacity:0; transition:.3s; }
  .player-wrap:hover .player-controls, .player-controls.show { opacity:1; }
  .player-title { font-size:15px; font-weight:600; }
  .player-row { display:flex; align-items:center; gap:12px; }
  .player-btn { background:rgba(255,255,255,.1); border:none; color:#fff; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .player-btn:hover { background:rgba(0,212,255,.3); }
  .player-back { position:absolute; top:12px; left:12px; z-index:5; background:rgba(0,0,0,.6); border:none; color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px; }

  /* LOADING */
  .loader { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#00d4ff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* BACK BUTTON */
  .back-bar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn { background:rgba(255,255,255,.08); border:none; color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  .back-btn:hover { background:rgba(0,212,255,.2); }
  .screen-title { font-size:18px; font-weight:600; }

  /* TOAST */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 20px; border-radius:24px; font-size:14px; z-index:1000; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-track { background:#0a1929; }
  ::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#00d4ff; }

  @media (max-width:480px) {
    .main-card { padding:20px 16px; }
    .card-icon { font-size:36px; width:58px; height:58px; }
    .card-info h3 { font-size:17px; }
    .list-container { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); }
    .channel-grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header" id="mainHeader">
  <div class="logo">ITV<span>Player</span></div>
  <button class="header-btn" onclick="logout()" title="Sair">⏻</button>
</div>

<!-- LOGIN SCREEN -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <h1>ITVPlayer</h1>
    <p class="sub">IPTV Profissional • Smarters Style</p>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>URL do Servidor</label>
      <input type="url" id="loginUrl" placeholder="http://servidor.com:porta" autocomplete="url">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">ENTRAR</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div class="screen" id="mainScreen">
  <h2 class="main-title">Bem-vindo ao ITVPlayer<small>Escolha uma categoria para começar</small></h2>
  <div class="main-grid">
    <div class="main-card" onclick="openSection('tv')">
      <div class="card-icon">📺</div>
      <div class="card-info"><h3>TV ao Vivo</h3><p>Canais SD, HD e FHD em tempo real</p></div>
    </div>
    <div class="main-card" onclick="openSection('movies')">
      <div class="card-icon">🎬</div>
      <div class="card-info"><h3>Filmes</h3><p>Catálogo completo de filmes</p></div>
    </div>
    <div class="main-card" onclick="openSection('series')">
      <div class="card-icon">🎭</div>
      <div class="card-info"><h3>Séries</h3><p>Temporadas e episódios</p></div>
    </div>
  </div>
</div>

<!-- CATEGORIES SCREEN -->
<div class="screen" id="categoriesScreen">
  <div class="back-bar">
    <button class="back-btn" onclick="showScreen('mainScreen')">← Voltar</button>
    <div class="screen-title" id="catTitle">Categorias</div>
  </div>
  <div class="list-container" id="categoriesList"></div>
</div>

<!-- ITEMS SCREEN (channels/movies/series) -->
<div class="screen" id="itemsScreen">
  <div class="back-bar">
    <button class="back-btn" onclick="showScreen('categoriesScreen')">← Voltar</button>
    <div class="screen-title" id="itemsTitle">Itens</div>
  </div>
  <div class="channel-grid" id="itemsList"></div>
</div>

<!-- SERIES SEASONS -->
<div class="screen" id="seasonsScreen">
  <div class="back-bar">
    <button class="back-btn" onclick="showScreen('itemsScreen')">← Voltar</button>
    <div class="screen-title" id="seasonsTitle">Temporadas</div>
  </div>
  <div class="list-container" id="seasonsList"></div>
</div>

<!-- EPISODES -->
<div class="screen" id="episodesScreen">
  <div class="back-bar">
    <button class="back-btn" onclick="showScreen('seasonsScreen')">← Voltar</button>
    <div class="screen-title" id="episodesTitle">Episódios</div>
  </div>
  <div class="channel-grid" id="episodesList"></div>
</div>

<!-- PLAYER SCREEN -->
<div class="screen" id="playerScreen">
  <div class="player-wrap">
    <button class="player-back" onclick="closePlayer()">←</button>
    <video id="videoPlayer" controls playsinline autoplay></video>
    <div class="player-controls show">
      <div class="player-title" id="playerTitle">Reproduzindo...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ ITVPlayer - Core ============ */
const state = {
  user:'', pass:'', url:'',
  section:null,
  categories:[],
  items:[],
  currentSeries:null,
  hls:null,
  isXtream:false
};

/* ---------- Screen Navigation ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('mainHeader').style.display = (id==='playerScreen'||id==='loginScreen') ? 'none' : 'flex';
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- Login ---------- */
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  let url=document.getElementById('loginUrl').value.trim();
  const err=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  err.textContent='';
  if(!u||!p||!url){ err.textContent='Preencha todos os campos'; return; }
  if(!/^https?:\/\//i.test(url)) url='http://'+url;
  url=url.replace(/\/+$/,'');

  btn.disabled=true; btn.innerHTML='<span class="loader"></span>Conectando...';

  state.user=u; state.pass=p; state.url=url;

  // Tenta Xtream Codes API
  try{
    const apiUrl=`${url}/player_api.php?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;
    const r=await fetch(apiUrl);
    if(r.ok){
      const data=await r.json();
      if(data.user_info && data.user_info.auth){
        state.isXtream=true;
        localStorage.setItem('itvplayer',JSON.stringify({u,p,url}));
        toast('✓ Login realizado (Xtream)');
        showScreen('mainScreen');
        btn.disabled=false; btn.textContent='ENTRAR';
        return;
      }
    }
  }catch(e){ /* fallback M3U */ }

  // Tenta M3U
  try{
    const m3uUrl=`${url}/get.php?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}&type=m3u_plus&output=ts`;
    const r=await fetch(m3uUrl);
    if(r.ok){
      const txt=await r.text();
      if(txt.includes('#EXTM3U')){
        state.isXtream=false;
        state.m3uData=parseM3U(txt);
        localStorage.setItem('itvplayer',JSON.stringify({u,p,url}));
        toast('✓ Login realizado (M3U)');
        showScreen('mainScreen');
        btn.disabled=false; btn.textContent='ENTRAR';
        return;
      }
    }
  }catch(e){}

  // Modo demo se tudo falhar (apenas para teste de UI)
  err.textContent='Não foi possível conectar. Verifique os dados.';
  btn.disabled=false; btn.textContent='ENTRAR';
}

function logout(){
  if(!confirm('Deseja sair?')) return;
  localStorage.removeItem('itvplayer');
  location.reload();
}

/* ---------- M3U Parser ---------- */
function parseM3U(text){
  const lines=text.split(/\r?\n/);
  const data={live:[],movies:[],series:[]};
  let current=null;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(l.startsWith('#EXTINF')){
      const grp=(l.match(/group-title="([^"]*)"/)||[])[1]||'Sem categoria';
      const logo=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      const name=l.split(',').slice(1).join(',').trim();
      current={name,group:grp,logo,url:''};
      const gl=grp.toLowerCase();
      if(/\b(filme|movie|vod|film)\b/.test(gl)) current._type='movies';
      else if(/\b(série|serie|series|epis)\b/.test(gl)) current._type='series';
      else current._type='live';
    } else if(l && !l.startsWith('#') && current){
      current.url=l;
      data[current._type].push(current);
      current=null;
    }
  }
  return data;
}

/* ---------- Open Section ---------- */
async function openSection(sec){
  state.section=sec;
  const titles={tv:'TV ao Vivo',movies:'Filmes',series:'Séries'};
  document.getElementById('catTitle').textContent=titles[sec];
  document.getElementById('categoriesList').innerHTML='<div class="loader"></div> Carregando...';
  showScreen('categoriesScreen');

  try{
    if(state.isXtream){
      let action={tv:'get_live_categories',movies:'get_vod_categories',series:'get_series_categories'}[sec];
      const r=await fetch(`${state.url}/player_api.php?username=${encodeURIComponent(state.user)}&password=${encodeURIComponent(state.pass)}&action=${action}`);
      const data=await r.json();
      state.categories=Array.isArray(data)?data:[];
    } else {
      const key={tv:'live',movies:'movies',series:'series'}[sec];
      const map={};
      state.m3uData[key].forEach(it=>{
        if(!map[it.group]) map[it.group]={category_id:it.group,category_name:it.group};
      });
      state.categories=Object.values(map);
    }
    renderCategories();
  }catch(e){
    document.getElementById('categoriesList').innerHTML='<p style="color:#ff5252">Erro ao carregar categorias</p>';
  }
}

function renderCategories(){
  const list=document.getElementById('categoriesList');
  if(!state.categories.length){ list.innerHTML='<p>Nenhuma categoria encontrada</p>'; return; }
  list.innerHTML=state.categories.map(c=>`
    <div class="list-item" onclick="openCategory('${c.category_id}','${(c.category_name||'').replace(/'/g,"\\'")}')">
      <span>${c.category_name||'Sem nome'}</span>
    </div>`).join('');
}

/* ---------- Open Category ---------- */
async function openCategory(catId,catName){
  document.getElementById('itemsTitle').textContent=catName;
  document.getElementById('itemsList').innerHTML='<div class="loader"></div> Carregando...';
  showScreen('itemsScreen');

  try{
    if(state.isXtream){
      let action={tv:'get_live_streams',movies:'get_vod_streams',series:'get_series'}[state.section];
      const r=await fetch(`${state.url}/player_api.php?username=${encodeURIComponent(state.user)}&password=${encodeURIComponent(state.pass)}&action=${action}&category_id=${catId}`);
      const data=await r.json();
      state.items=Array.isArray(data)?data:[];
    } else {
      const key={tv:'live',movies:'movies',series:'series'}[state.section];
      state.items=state.m3uData[key].filter(it=>it.group===catId);
    }
    renderItems();
  }catch(e){
    document.getElementById('itemsList').innerHTML='<p style="color:#ff5252">Erro ao carregar</p>';
  }
}

function renderItems(){
  const list=document.getElementById('itemsList');
  if(!state.items.length){ list.innerHTML='<p>Nenhum item encontrado</p>'; return; }
  list.innerHTML=state.items.map((it,idx)=>{
    const name=it.name||it.title||'Sem nome';
    const logo=it.stream_icon||it.cover||it.logo||'';
    const quality=it.rating||it.added||'';
    const thumb=logo?`<img src="${logo}" onerror="this.parentElement.innerHTML='🎬'">`:'';
    return `
    <div class="channel-card" onclick="selectItem(${idx})">
      <div class="channel-thumb">${thumb||'🎬'}</div>
      <div class="channel-name">${name}</div>
    </div>`;
  }).join('');
}

/* ---------- Select Item ---------- */
async function selectItem(idx){
  const it=state.items[idx];
  if(state.section==='series' && state.isXtream){
    state.currentSeries=it;
    document.getElementById('seasonsTitle').textContent=it.name;
    document.getElementById('seasonsList').innerHTML='<div class="loader"></div> Carregando...';
    showScreen('seasonsScreen');
    try{
      const r=await fetch(`${state.url}/player_api.php?username=${encodeURIComponent(state.user)}&password=${encodeURIComponent(state.pass)}&action=get_series_info&series_id=${it.series_id}`);
      const data=await r.json();
      state.seriesInfo=data;
      const seasons=Object.keys(data.episodes||{}).sort((a,b)=>a-b);
      document.getElementById('seasonsList').innerHTML=seasons.map(s=>`
        <div class="list-item" onclick="openSeason('${s}')"><span>Temporada ${s}</span></div>
      `).join('') || '<p>Sem temporadas</p>';
    }catch(e){ document.getElementById('seasonsList').innerHTML='<p>Erro</p>'; }
    return;
  }
  // TV ou Filme - play direto
  playItem(it);
}

function openSeason(sNum){
  const eps=state.seriesInfo.episodes[sNum]||[];
  document.getElementById('episodesTitle').textContent=`Temporada ${sNum}`;
  document.getElementById('episodesList').innerHTML=eps.map((ep,i)=>`
    <div class="channel-card" onclick='playEpisode(${JSON.stringify(ep).replace(/'/g,"&#39;")})'>
      <div class="channel-thumb">${ep.info&&ep.info.movie_image?`<img src="${ep.info.movie_image}">`:'🎭'}</div>
      <div class="channel-name">E${ep.episode_num} - ${ep.title||'Episódio '+ep.episode_num}</div>
    </div>
  `).join('');
  showScreen('episodesScreen');
}

function playEpisode(ep){
  const ext=ep.container_extension||'mp4';
  const url=`${state.url}/series/${encodeURIComponent(state.user)}/${encodeURIComponent(state.pass)}/${ep.id}.${ext}`;
  playUrl(url, ep.title||'Episódio');
}

/* ---------- Player ---------- */
function playItem(it){
  let url,title;
  if(state.isXtream){
    if(state.section==='tv'){
      url=`${state.url}/live/${encodeURIComponent(state.user)}/${encodeURIComponent(state.pass)}/${it.stream_id}.m3u8`;
      title=it.name;
    } else if(state.section==='movies'){
      const ext=it.container_extension||'mp4';
      url=`${state.url}/movie/${encodeURIComponent(state.user)}/${encodeURIComponent(state.pass)}/${it.stream_id}.${ext}`;
      title=it.name;
    }
  } else {
    url=it.url; title=it.name;
  }
  playUrl(url,title);
}

function playUrl(url,title){
  document.getElementById('playerTitle').textContent=title||'Reproduzindo';
  showScreen('playerScreen');
  const video=document.getElementById('videoPlayer');

  // Limpa player anterior (anti-travamento)
  if(state.hls){ try{state.hls.destroy();}catch(e){} state.hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();

  // Anti-travamento: buffer otimizado
  video.buffered && (video.currentTime=0);

  if(url.includes('.m3u8') && window.Hls && Hls.isSupported()){
    const hls=new Hls({
      maxBufferLength:30,
      maxMaxBufferLength:60,
      startFragPrefetch:true,
      enableWorker:true,
      lowLatencyMode:false,
      backBufferLength:30
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,data)=>{
      if(data.fatal){
        switch(data.type){
          case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
          case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
          default: toast('Erro: tente novamente'); closePlayer(); break;
        }
      }
    });
    state.hls=hls;
  } else {
    video.src=url;
    video.play().catch(err=>toast('Erro ao reproduzir'));
  }
}

function closePlayer(){
  const video=document.getElementById('videoPlayer');
  if(state.hls){ try{state.hls.destroy();}catch(e){} state.hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  // Volta para tela anterior
  if(document.getElementById('episodesScreen').style.display!=='none' && state.section==='series') showScreen('episodesScreen');
  else showScreen('itemsScreen');
}

/* ---------- Auto-login ---------- */
window.addEventListener('load',()=>{
  const saved=localStorage.getItem('itvplayer');
  if(saved){
    try{
      const d=JSON.parse(saved);
      document.getElementById('loginUser').value=d.u;
      document.getElementById('loginPass').value=d.p;
      document.getElementById('loginUrl').value=d.url;
    }catch(e){}
  }
});

// Tecla ESC fecha player
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.getElementById('playerScreen').classList.contains('active')) closePlayer();
});
</script>
</body>
